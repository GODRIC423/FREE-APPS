 call, no voicemail. Email follows within 10 minutes regardless.`},B:{name:`20s voicemail`,sent:16,replies:3,meetings:1,copy:`Voicemail: "Hi {{first}}, Dana from Meridian — just sent you an email titled ‘dock scheduling’ with a 40-second idea. No need to call back."`}}},{code:`EXP-005`,channel:`email`,started:`2026-05-19`,status:`concluded`,verdict:`flat`,title:`Body length: 120 words vs. 55 words`,hypothesis:`Halving the body will raise replies without hurting meeting quality.`,audience:`Marketing directors, e-commerce $5–50M GMV`,learning:`Length alone moved nothing — the intervals sat on top of each other. What we cut mattered more than how much: the personalized first line was the only load-bearing sentence.`,variants:{A:{name:`120-word body`,sent:80,replies:9,meetings:3,copy:`Full framework email: personalized line, problem story, 3-bullet proof, CTA. ~120 words.`},B:{name:`55-word body`,sent:82,replies:11,meetings:3,copy:`Compressed: personalized line, one-sentence claim, single proof point, CTA. ~55 words.`}}},{code:`EXP-006`,channel:`sms`,started:`2026-07-17`,status:`running`,verdict:``,title:`Follow-up timing: day 2 vs. day 5`,hypothesis:`A day-5 SMS bump will feel less pushy and reply better than day 2 after no email response.`,audience:`Opted-in webinar registrants who ghosted the recap email`,learning:``,variants:{A:{name:`Day-2 bump`,sent:22,replies:2,meetings:0,copy:`{{first}} — Dana here. Sent the teardown Tuesday; want me to resend or drop it?`},B:{name:`Day-5 bump`,sent:19,replies:4,meetings:1,copy:`{{first}} — no rush on the teardown from last week. If timing is off, one word ("later") parks it till Q4.`}}}],insights:[{text:`Name the metric in the subject line. Specificity out-pulled curiosity 2.7x and pre-qualified the replies.`,tag:`subject lines`,source:`EXP-001`,date:`2026-06-14`},{text:`On first touch, ask for interest, not 30 minutes. Interest CTAs doubled replies and still won on meetings.`,tag:`CTAs`,source:`EXP-003`,date:`2026-06-30`},{tex
