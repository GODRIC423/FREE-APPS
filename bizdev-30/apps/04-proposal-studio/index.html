We would be proud to do this work.

Jonas Grange`},{id:`s-problem`,kind:`problem`,title:`The Situation`,included:!0,body:`In our conversations and the audit visit, three things came through clearly:

- Harbor Lane’s four properties present as four unrelated hotels. The marque on the Beacon Street awning does not appear anywhere on the website that books it.
- Direct bookings sit at 31% against an independent-hotel benchmark of roughly 50%. The difference flows to OTA commissions — at your volume, an estimated $310,000 a year.
- The booking flow takes eleven steps and loses 68% of guests after the room-select page. Your own front desk calls it "the maze."

Guests who arrive love the stay: your 4.7 review average proves it. The brand and the booking journey are the only parts of Harbor Lane that do not yet deserve those reviews. Left as they are, the OTA dependency compounds every season.`},{id:`s-approach`,kind:`approach`,title:`Our Approach`,included:!0,body:`We work in three moves:

- Listen — two days on property, twelve guest interviews, and a teardown of the six competitors your guests also shortlist. We write down what Harbor Lane means before we draw anything.
- Set — the identity system: marque, palette, typography, voice. Everything is tested on real artefacts first — a key card, a booking confirmation, the Beacon Street awning — never on a mood board.
- Build — the booking journey redesigned around one promise: room, rate, and confirmation in under three minutes, with the brand present at every step.

Two principles run through all of it. First, the brand must survive the hallway: if it only works on a slide, it does not work. Second, every design decision must be traceable to a guest we interviewed — taste is not a strategy.`},{id:`s-scope`,kind:`scope`,title:`Scope & Deliverables`,included:!0,body:`This engagement delivers, concretely:

- One voice & messaging guide covering website, confirmations, and in-room print.
- Twelve website templates, designed and prototyped, with a component library your developers implement directly.
- One redesigned booking journey, from search to confirmation email, prototyped and tested with eight guests.
- One brand book, printed and digital, plus a 90-day rollout playbook ordered by cost and visibility.

Each deliverable is accepted when it passes the review round defined in Terms. Anything not listed here is out of scope and quoted separately.`},{id:`s-timeline`,kind:`timeline`,title:`Timeline & Milestones`,included:!0,body:`From a signed acceptance, the work runs fourteen weeks:
