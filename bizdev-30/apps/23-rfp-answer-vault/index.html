certifications do you hold (SOC 2, ISO 27001, etc.)?`,`Fathom holds a SOC 2 Type II report, renewed annually and available under NDA through the security portal. ISO 27001 certification is in progress with a target completion this year; a letter of attestation from our auditor is available on request in the meantime.`,`security`,[`soc2`,`iso27001`,`certifications`],`Priya Nair — Security`,214,`SOC 2 report cover letter`),e(`ans-1003`,`How do you handle a security incident or suspected data breach?`,`We run a documented incident response plan with a 24/7 on-call security rotation. Confirmed incidents affecting customer data trigger notification within 72 hours, consistent with GDPR and most state breach-notification laws, along with a written root-cause report once the investigation closes.`,`security`,[`incident-response`,`breach-notification`],`Priya Nair — Security`,38,``),e(`ans-1004`,`Do you support single sign-on (SSO) and SCIM provisioning?`,`Yes. We support SAML 2.0 and OIDC for SSO with any major identity provider (Okta, Azure AD, Google Workspace), and SCIM for automated user provisioning and deprovisioning. SSO is included at no extra cost on all paid tiers.`,`security`,[`sso`,`saml`,`scim`],`Priya Nair — Security`,11,``),e(`ans-1005`,`Provide an overview of your company: founding year, headcount, and headquarters.`,`Fathom was founded in 2018 and is headquartered in Austin, TX, with a distributed team of 140 employees across North America and Europe. We are privately held and have been cash-flow positive since 2023.`,`company`,[`company-overview`,`background`],`Owen Ruiz — RevOps`,15,``),e(`ans-1006`,`What is your gross and net customer retention rate?`,`Trailing twelve months: 96% gross revenue retention and 112% net revenue retention, driven primarily by seat expansion within existing accounts. We publish these figures in our annual customer trust report.`,`company`,[`retention`,`metrics`],`Owen Ruiz — RevOps`,132,`Annual trust report, FY25`),e(`ans-1007`,`Provide three reference customers we can contact.`,`We can provide references from three accounts of comparable size and industry once we reach the shortlist stage; typical references include a mid-market logistics operator, a regional healthcare network, and a public-sector agency. We ask for two weeks notice to confirm availability with the reference contact.`,`company`,[`references`],`Owen Ruiz — RevOps`,61,``),e(`ans-1008`,`Describe your API and third-party integration capabilities.`,`Fathom exposes a versioned REST API with webhook support for real-time events, rate-limited at 600 requests/minute per tenant with burst headroom on request. We publish SDKs for Python, Node, and Java, plus prebuilt connectors for Salesforce, NetSuite, and 30+ other systems.`,`product`,[`api`,`integrations`,`webhooks`],`Dev Chen — Product`,6,`API docs`),e(`ans-1009`,`What is your platform uptime SLA and historical availability?`,`Our contractual SLA is 99.9% monthly uptime with service credits for shortfalls. Actual trailing-12-month availability is 99.97%, published live on our status page along with incident history and postmortems for any outage over 15 minutes.`,`product`,[`uptime`,`sla`,`status-page`],`Dev Chen — Product`,27,`status.fathom (public)`),e(`ans-1010`,`How does your product handle data residency requirements (EU, US, etc.)?`,`Customer data is hosted in the US East region by default. An EU hosting option (Frankfurt) is available on request for an additional infrastructure fee. All regions run the same security controls and backup schedule.`,`product`,[`data-residency`,`gdpr`,`hosting`],`Dev Chen — Product`,301,`Infra architecture doc v2`),e(`ans-1011`,`What does a typical implementation timeline look like?`,`Standard implementations run 3-6 weeks in three phases: data migration and integration setup (weeks 1-2), configuration and workflow mapping (weeks 3-4), and a pilot rollout with a subset of users before full go-live. A dedicated implementation manager runs weekly checkpoints throughout.`,`implementation`,[`onboarding`,`timeline`,`rollout`],`Marisol Vega — CS`,49,``),e(`ans-1012`,`Describe your customer support model and response-time SLAs.`,`All plans include email and in-app chat support with a 4-business-hour first response SLA; enterprise plans add a named customer success manager and a 1-hour SLA on severity-1 issues via a dedicated escalation line, available 24/7.`,`implementation`,[`support`,`sla`],`Marisol Vega — CS`,18,``),e(`ans-1013`,`What training and enablement do you provide during rollout?`,`Rollout includes live admin training, role-specific end-user sessions, an in-app guided walkthrough for first-time users, and a resource hub of short how-to videos. Enterprise plans add a customized train-the-trainer session for internal champions.`,`implementation`,[`training`,`enablement`],`Marisol Vega — CS`,168,``),e(`ans-1014`,`Describe your pricing model and what is included at each tier.`,`Pricing is a hybrid of a per-seat platform fee plus metered usage above an included allotment, billed monthly or annually. Three tiers (Team, Business, Enterprise) differ mainly in SSO/SCIM, API rate limits, support SLA, and audit-log retention; all tiers include the core workflow features.`,`commercial`,[`pricing`,`packaging`],`Owen Ruiz — RevOps`,8,``),e(`ans-1015`,`What are your standard payment terms?`,`Standard terms are net 30 on invoiced annual contracts, with a 10% discount for annual prepay. Monthly self-serve plans are billed by credit card at the start of each cycle. Custom terms are available for multi-year enterprise agreements.`,`commercial`,[`payment-terms`,`billing`],`Owen Ruiz — RevOps`,74,``),e(`ans-1016`,`Will you sign a Data Processing Agreement (DPA) with GDPR-standard contractual clauses?`,`Yes. Our standard DPA incorporates the EU Standard Contractual Clauses and is available for redline through our legal team; most counterparties execute it without changes within a few business days.`,`legal`,[`dpa`,`
