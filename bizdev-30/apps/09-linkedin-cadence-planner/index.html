till run finance out of a spreadsheet — and feel it every month-end`,voice:`Plainspoken and numbers-first. Short lines. A mild contrarian streak. No hashtags, no hype words, no "game-changer".`,month:e,posts:[a(1,`proof`,`posted`,`Last quarter I found $61,000 of dead spend inside a 14-person SaaS company. It took one afternoon and zero layoffs.`,`Nobody was careless. Everybody was busy.

The money was hiding in the boring places:

— 11 seats on tools nobody had opened since March
— An annual contract auto-renewed at list price
— A "temporary" contractor in month nine
— Two departments paying for the same analytics stack

The fix was not a spreadsheet. It was an owner.

Every line of spend now has a name next to it. When a renewal lands, a human decides.

Burn is a leadership metric, not a finance metric.`,`Want the 20-line audit checklist we used? Comment LEDGER and I will send it over.`),a(3,`howto`,`posted`,`How to build a 13-week cash forecast in 45 minutes. No new software. The template my clients actually keep using.`,`Most forecasts die because they are built for the board, not for Monday morning.

The 45-minute version:

1. One row per cash-in source, one per cash-out bucket. Twelve rows max.
2. Thirteen columns. Weeks, not months — payroll does not care about months.
3. Enter only what is CONTRACTED for weeks 1-4. Everything else gets a confidence tag.
4. Bold one cell: lowest projected balance. That cell is your job now.
5. Update it every Monday. Ten minutes once it exists.

A forecast you update beats a model you admire.`,`Comment FORECAST and I will DM you the sheet.`),a(6,`story`,`posted`,`In 2019 I watched a $4M ARR company die with money in the bank. The invoice that killed them was $12,000.`,`They had 34% of revenue concentrated in one enterprise logo.

That customer switched to 90-day payment terms in a procurement "update". Nobody escalated it — $12k was too small to escalate.

Three quarters later the gap between booked and banked was $600k wide. Payroll bridged on a credit line. The credit line got called.

The post-mortem took one sentence: revenue is an opinion, cash is a fact.

I have opened every client engagement since with the same question: who actually controls the timing of your cash?`,`Follow for one honest SaaS finance story every week.`),a(8,`contrarian`,`posted`,`Your SaaS does not have a growth problem. It has a margin problem you keep calling a growth problem.`,`Growth covers sins. Everyone knows this. Almost nobody acts on it.

What I see inside the books at $1-10M ARR:

— Gross margin quoted at 80%, real number 62% once support and success land where they belong
— CAC payback "12 months" that is 21 once you count ramp time
— Discounts nobody remembers approving, renewing on autopilot

Fix the margin math first. Then growth compounds something worth compounding.

Growth on broken unit economics is just a faster way to need a bridge round.`,`Disagree? Tell me why in the comments — I read every one.`),a(10,`proof`,`posted`,`We moved one client from monthly to annual billing on 40% of contracts. Net burn fell $38,000 a month. Here is the playbook.`,`No product changes. No new hires. Ninety days.

The playbook:

1. Segment: which customers already behave annually? (Low support load, steady usage.)
2. Offer: two months free is cheaper than the fundraise you avoid.
3. Script: renewals only. Never mid-term. One email, one call.
4. Floor: never discount below the margin line we drew first.

Result: 40% adoption, DSO down 19 days, and the founder stopped checking the bank balance before approving expenses.

Cash timing is a product decision wearing a finance costume.`,`Want the renewal email script? Comment ANNUAL.`),a(13,`howto`,`posted`,`The 5 numbers I check every Monday before I touch email. Nine minutes. Catches 90% of cash surprises early.`,`Monday, 8:00, coffee, five numbers:

1. Bank balance vs. forecast cell — variance over 5% gets a note
2. AR over 30 days — who moved, who did not
3. Weekly net burn, trailing 4-week average
4. New MRR booked vs. cash actually collected
5. Days until lowest projected balance

No dashboard. One sheet, five cells, nine minutes.

The discipline is not the numbers. It is refusing to open your inbox first.`,`Steal the sheet: comment MONDAY and it is yours.`),a(15,`story`,`posted`,`A founder told me "we will fix pricing after we hit $5M." We modeled the wait. It was costing him $23,000 a week.`,`He was not wrong to be scared. Repricing feels like touching a live wire.

So we did not touch existing customers at all.

New deals only: value-metric pricing, 18% higher anchor, one fewer discount tier. Sales team had one page of talk tracks.

Win rate moved from 31% to 29%. Statistically noise.
Average contract value moved 24%. Statistically rent.

Six months later the "after $5M" plan happened at $4.2M — funded by the pricing he was afraid of.

The expensive decision is usually the one you defer.`,`If pricing scares you, my DMs are open. No pitch, just the model.`),a(17,`contrarian`,`posted`,`Hiring a full-time CFO at $2M ARR is how founders buy themselves a very expensive feeling of safety.`,`A $220k executive to produce reports nobody reads is not finance. It is theater with a headcount line.

What a $2M ARR company actually needs:

— A closed month by day 10
— A 13-week cash view someone owns
— Pricing reviewed twice a year
— A board pack with three decisions, not thirty slides

That is 3-4 focused days a month. Buy days, not a title.

Hire the full-time CFO when the work is full-time: audit, debt, M&A, real board complexity. Usually $8-15M ARR.

Until then, rent the brain and keep the equity.`,`Founders past $5M: what finally made a full-time hire worth it? Genuinely asking.`),a(20,`proof`,`scheduled`,`Q2 client scoreboard: median burn down 18%, runway up 4.1 months, zero layoffs across the book. The 3 moves that did the work.`,`Twelve clients, one quarter, full transparency (ranges to protect identities):

— Burn: down 4% to 31%, median 18%
— Runway: up 1.9 to 7.3 months, median 4.1
— Layoffs: zero

The three moves that showed up in every win:

1. Spend got an owner per line, reviewed monthly
2. Billing terms renegotiated at renewal, never mid-term
3. One pricing decision founders had been deferring, made

No heroics. No 5am hustle posts. Just decisions with dates on them.`,`Q3 cohort opens next month — two seats. DM "SCOREBOARD" for the criteria.`),a(22,`howto`,`scheduled`,`How to read a SaaS P&L in 6 lines. If your accountant sends you forty, this is the translation layer.`,`The six lines that matter at $1-10M ARR:

1. Recurring revenue (only the recurring part)
2. Cost to serve it — support, success, hosting
3. Gross margin — line 1 minus line 2, honest version
4. Sales & marketing as % of new ARR
5. Everything else, one line, no drama
6. Net burn, in dollars and in weeks of runway

If a line cannot change a decision, it does not belong in front of a founder.

Print yours. Cross out everything that is not one of these six. What is left is your actual business.`,`Want my 6-line template mapped to QuickBooks? Comment SIXLINES.`),a(24,`story`,`drafted`,`My first fractional client fired me after six weeks. It was the best thing that ever happened to my practice.`,`They wanted a bookkeeper with a CFO title. I kept showing up with decisions instead of reports.

"We just need the numbers done" is a fair thing to want. It is not what I sell.

So I wrote the niche statement I still use today — and put WHO IT IS NOT FOR above who it is for.

Revenue dipped for one quarter. Close rate tripled the next.
